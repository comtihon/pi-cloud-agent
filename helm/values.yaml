replicaCount: 1

image:
  repository: ghcr.io/comtihon/pi-cloud-agent
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion prefixed with "v" when empty.
  tag: v0.1.3

healthchecks:
  enabled: false

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Plain env vars injected into the container.
#
# ai-agents-carrier's K8sRuntime sets these at `helm upgrade --install` time:
#   --set env.AGENT_PORT=8000
#   --set env.BACKEND_CALLBACK_URL=<carrier base url>
#   --set env.RUN_ID=<workflow run id>
#   --set-string env.<KEY>=<value>   (one per agent_input env_var: API keys, etc.)
#
# Keep this block as a flat map — nested values are dropped by the runtime.
env: {}

# Static config, rendered as UPPERCASED env vars. A nested map is flattened
# to PARENT_CHILD keys.
config: {}

# Env vars sourced from existing k8s Secrets: NAME: {name: <secret>, key: <key>}
secrets: {}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 (`node`) and needs no write access to its root
# filesystem — every runtime write target is one of the emptyDir mounts below.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# /home/node, /tmp and /workspace are mounted as emptyDirs by the Deployment
# template itself — readOnlyRootFilesystem makes them mandatory, so they are not
# configurable here (and cannot be clobbered by `--set-json volumes=...`).
# Anything listed below is mounted in addition to those three.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
