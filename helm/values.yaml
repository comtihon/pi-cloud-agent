replicaCount: 1

image:
  repository: ghcr.io/comtihon/pi-cloud-agent
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion prefixed with "v" when empty.
  tag: v0.1.5

# acp-web-proxy serves GET /health on service.port.
healthchecks:
  enabled: false

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Plain env vars injected into the container.
#
# The container runs acp-web-proxy on service.port (8000), path /acp, which
# spawns pi-carrier-agent (ACP over stdio). ai-agents-carrier's runtime sets at
# `helm upgrade --install` time:
#   --set-string env.ACP_PROXY_TOKEN=<fresh token per pod>   (required: the
#                proxy rejects every WebSocket without it)
#   --set-string env.<KEY>=<value>   (optional extra env; per-run tools,
#                credentials, MCP servers and model arrive in ACP session/new)
#
# Keep this block as a flat map — nested values are dropped by the runtime.
env: {}

# Static config, rendered as UPPERCASED env vars. A nested map is flattened
# to PARENT_CHILD keys.
config: {}

# Env vars sourced from existing k8s Secrets: NAME: {name: <secret>, key: <key>}
secrets: {}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 (`node`) and needs no write access to its root
# filesystem — every runtime write target is one of the emptyDir mounts below.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# /home/node, /tmp and /workspace are mounted as emptyDirs by the Deployment
# template itself — readOnlyRootFilesystem makes them mandatory, so they are not
# configurable here (and cannot be clobbered by `--set-json volumes=...`).
# Anything listed below is mounted in addition to those three.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
